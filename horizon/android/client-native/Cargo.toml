[package]
name = "horizon-android-client-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"

[lib]
name = "horizon_android_client"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.15.1"
horizon-client = { path = "../../crates/horizon-client" }
log = "0.4"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
