[package]
name = "horizon-android-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"

[lib]
name = "horizon_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.15.1"
log = "0.4"
pollster = "=0.4.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
